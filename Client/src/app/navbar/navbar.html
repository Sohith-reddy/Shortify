<header class="nav" [class.nav-scrolled]="isScrolled()">
  <div class="nav-inner">
    <a class="brand" routerLink="/" aria-label="Shortify home">
      <span class="brand-mark" aria-hidden="true">
        <i class="pi pi-link"></i>
      </span>
      <span class="brand-text">Shortify</span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      @for (link of navLinks; track link.href) {
        <a
          class="nav-link"
          [routerLink]="link.href"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="{ exact: link.href === '/' }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="nav-actions">
      <button
        type="button"
        class="icon-button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.label()"
      >
        <i [class]="theme.icon()"></i>
      </button>

      <button
        type="button"
        class="avatar-button"
        (click)="menu.toggle($event)"
        aria-label="Open account menu"
      >
        <p-avatar label="S" shape="circle" size="normal" />
      </button>

      <p-menu #menu [model]="profileItems" [popup]="true" [appendTo]="'body'" />

      <button
        type="button"
        class="icon-button nav-burger"
        (click)="toggleMobile()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Toggle navigation menu"
      >
        <i [class]="mobileOpen() ? 'pi pi-times' : 'pi pi-bars'"></i>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <nav class="nav-mobile" aria-label="Mobile">
      @for (link of navLinks; track link.href) {
        <a
          class="nav-mobile-link"
          [routerLink]="link.href"
          routerLinkActive="nav-mobile-link-active"
          [routerLinkActiveOptions]="{ exact: link.href === '/' }"
        >
          <i [class]="link.icon"></i>
          <span>{{ link.label }}</span>
        </a>
      }
      <a class="nav-mobile-link" routerLink="/profile" routerLinkActive="nav-mobile-link-active">
        <i class="pi pi-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  }
</header>
